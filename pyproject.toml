[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctocanvas"
version = "0.1.0"
description = "Draw boxes, text and lines on an infinite terminal canvas, then save them as YAML, ASCII, PNG, or SVG."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "svgwrite>=1.4",
]

[project.scripts]
ctocanvas = "ctocanvas:cli"

[tool.setuptools]
py-modules = ["ctocanvas"]
